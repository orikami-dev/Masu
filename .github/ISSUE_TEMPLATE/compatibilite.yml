name: Game compatibility
description: Tell whether a game works in Masu (the "Report compatibility" button in Masu pre-fills this form)
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! This report is **public**. Never put a key, a game file or personal information in it
        (first name, machine name, folder path, address). The result is filed automatically on
        [the compatibility page](https://github.com/orikami-dev/Masu/blob/main/docs/COMPATIBILITE.md).
  - type: input
    id: jeu
    attributes:
      label: Game
      placeholder: Game name
    validations:
      required: true
  - type: input
    id: id_titre
    attributes:
      label: Title ID
      description: 16 characters, shown by Masu on the game page.
      placeholder: 0100XXXXXXXXXXXX
    validations:
      required: true
  - type: input
    id: version_jeu
    attributes:
      label: Game version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: version_masu
    attributes:
      label: Masu version
      placeholder: "1.11"
    validations:
      required: true
  - type: input
    id: appareil
    attributes:
      label: Chip and system
      description: Only the graphics chip, the driver and the Android or Windows version. No device name.
      placeholder: Adreno 7xx - System/Turnip - Android 1x
    validations:
      required: true
  - type: dropdown
    id: resultat
    attributes:
      label: Result
      options:
        - Perfect
        - Playable
        - Partial
        - Starts then crashes
        - Doesn't start
    validations:
      required: true
  - type: input
    id: jusqu_ou
    attributes:
      label: How far it goes
      placeholder: title screen, menus, first level, full playthrough…
  - type: textarea
    id: notes
    attributes:
      label: What you noticed
      placeholder: frames per second, display glitches, sound, controller…
  - type: textarea
    id: rapport
    attributes:
      label: Report excerpt (optional)
      description: Masu already masks keys. Review before sending.
      render: text
  - type: checkboxes
    id: accord
    attributes:
      label: Check
      options:
        - label: I put no key, no game file and no personal information.
          required: true
