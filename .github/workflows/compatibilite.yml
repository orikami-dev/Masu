name: Compatibility

# Rewrites docs/COMPATIBILITE.md and docs/compatibilite.json on every "compatibility" report.
# The generator is right here: the repository contains no app code.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

concurrency:
  group: compatibility
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  page:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'compatibility') || contains(github.event.issue.labels.*.name, 'compatibilité') || startsWith(github.event.issue.title, '[Compatibility]') || startsWith(github.event.issue.title, '[Compatibilité]') || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - docs/COMPATIBILITE.md --json docs/compatibilite.json --repo "${{ github.repository }}" <<'PY'
          import argparse
          import json
          import os
          import re
          import sys
          import urllib.request

          LABELS = {"compatibility", "compatibilité"}
          TITLES = ("[Compatibility]", "[Compatibilité]")
          # Canonical values (kept for the app and docs/compatibilite.json) <- accepted spellings.
          CANON = {
              "Parfait": "Parfait", "Perfect": "Parfait",
              "Jouable": "Jouable", "Playable": "Jouable",
              "Partiel": "Partiel", "Partial": "Partiel",
              "Démarre puis plante": "Démarre puis plante", "Starts then crashes": "Démarre puis plante",
              "Ne démarre pas": "Ne démarre pas", "Doesn't start": "Ne démarre pas",
          }
          RESULTS = ["Parfait", "Jouable", "Partiel", "Démarre puis plante", "Ne démarre pas"]
          DISPLAY = {"Parfait": "Perfect", "Jouable": "Playable", "Partiel": "Partial",
                       "Démarre puis plante": "Starts then crashes", "Ne démarre pas": "Doesn't start"}
          DOTS = {"Parfait": "🟢", "Jouable": "🟢", "Partiel": "🟡", "Démarre puis plante": "🟠", "Ne démarre pas": "🔴"}
          FIELDS = {
              "Game": "jeu", "Jeu": "jeu",
              "Title ID": "id_titre", "Identifiant de titre": "id_titre",
              "Game version": "version_jeu", "Version du jeu": "version_jeu",
              "Masu version": "version_masu", "Version de Masu": "version_masu",
              "Chip and system": "appareil", "Puce et système": "appareil",
              "Result": "resultat", "Résultat": "resultat",
              "How far it goes": "jusqu_ou", "Jusqu'où ça va": "jusqu_ou",
          }
          KEY = re.compile(r"(?i)(?<![0-9a-f])[0-9a-f]{32,}(?![0-9a-f])")


          def read_issues(repo):
              issues, page = [], 1
              token = os.environ.get("GITHUB_TOKEN")
              while True:
                  url = f"https://api.github.com/repos/{repo}/issues?state=all&per_page=100&page={page}"
                  req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
                  if token:
                      req.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(req) as r:
                      batch = json.load(r)
                  issues += [t for t in batch if "pull_request" not in t]
                  if len(batch) < 100:
                      return issues
                  page += 1


          def fields(body):
              """Reads the "### Title" sections that a GitHub issue form writes in the body."""
              values = {}
              for block in re.split(r"^### ", body or "", flags=re.M)[1:]:
                  title, _, text = block.partition("\n")
                  key = FIELDS.get(title.strip())
                  text = text.strip()
                  if key and text and text != "_No response_":
                      values[key] = KEY.sub("[key hidden]", text.splitlines()[0].strip())[:80]
              return values


          def cell(text):
              return (text or "—").replace("|", "\\|")


          def is_kept(t):
              # The label may not exist in the repository yet: the form title is recognized too.
              names = {e["name"] for e in t.get("labels", [])}
              if not (LABELS & names) and not t.get("title", "").startswith(TITLES):
                  return False
              return "invalide" not in names and t.get("state_reason") != "not_planned"


          def group(issues):
              games = {}
              for t in sorted(issues, key=lambda t: t["created_at"]):
                  if not is_kept(t):
                      continue
                  v = fields(t.get("body"))
                  v["resultat"] = CANON.get(v.get("resultat"), v.get("resultat"))
                  if v.get("resultat") not in RESULTS or not v.get("id_titre"):
                      continue
                  v["numero"], v["date"] = t["number"], t["created_at"][:10]
                  games.setdefault(v["id_titre"].upper(), []).append(v)
              return games


          def summary(games):
              return {
                  title_id: {k: r[-1].get(k) for k in ("jeu", "resultat", "version_jeu", "version_masu", "date")}
                  | {"retours": len(r), "ticket": r[-1]["numero"]}
                  for title_id, r in sorted(games.items())
              }


          def build(games, repo):

              lines = [
                  "# Game compatibility",
                  "",
                  "Page updated automatically from the reports sent from Masu",
                  f"([send a report](https://github.com/{repo}/issues/new?template=compatibilite.yml)).",
                  "Do not edit this file by hand: it is rewritten on every new report.",
                  "",
                  "🟢 perfect or playable · 🟡 partial · 🟠 starts then crashes · 🔴 doesn't start",
                  "",
              ]
              if not games:
                  lines += ["No report yet.", ""]
              else:
                  lines += [
                      "| Game | ID | Latest result | Game version | Masu | Chip and system | Reports |",
                      "|---|---|---|---|---|---|---|",
                  ]
                  for title_id, reports in sorted(games.items(), key=lambda kv: kv[1][-1].get("jeu", "").lower()):
                      d = reports[-1]
                      lines.append(
                          f"| {cell(d.get('jeu'))} | `{title_id}` | {DOTS[d['resultat']]} {DISPLAY[d['resultat']]} "
                          f"| {cell(d.get('version_jeu'))} | {cell(d.get('version_masu'))} | {cell(d.get('appareil'))} "
                          f"| {len(reports)} |"
                      )
                  lines.append("")
                  for title_id, reports in sorted(games.items(), key=lambda kv: kv[1][-1].get("jeu", "").lower()):
                      lines += [f"## {cell(reports[-1].get('jeu'))} (`{title_id}`)", ""]
                      lines += ["| Date | Result | How far | Game | Masu | Chip and system | Report |",
                                 "|---|---|---|---|---|---|---|"]
                      for r in reversed(reports):
                          lines.append(
                              f"| {r['date']} | {DOTS[r['resultat']]} {DISPLAY[r['resultat']]} | {cell(r.get('jusqu_ou'))} "
                              f"| {cell(r.get('version_jeu'))} | {cell(r.get('version_masu'))} "
                              f"| {cell(r.get('appareil'))} | #{r['numero']} |"
                          )
                      lines.append("")
              return "\n".join(lines)


          def main():
              p = argparse.ArgumentParser()
              p.add_argument("output")
              p.add_argument("--json", help="summary readable by Masu")
              p.add_argument("--repo", default="orikami-dev/Masu")
              p.add_argument("--issues", help="JSON file of issues, instead of the API")
              a = p.parse_args()
              if a.issues:
                  with open(a.issues, encoding="utf-8") as f:
                      issues = json.load(f)
              else:
                  issues = read_issues(a.repo)
              games = group(issues)
              with open(a.output, "w", encoding="utf-8") as f:
                  f.write(build(games, a.repo))
              if a.json:
                  with open(a.json, "w", encoding="utf-8") as f:
                      json.dump(summary(games), f, ensure_ascii=False, indent=2)
                      f.write("\n")
              print(f"{a.output}: {len(issues)} issue(s) read", file=sys.stderr)


          if __name__ == "__main__":
              main()
          PY
      - name: Publish if the page changed
        run: |
          git add docs/COMPATIBILITE.md docs/compatibilite.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Compatibility: page updated from reports"
          git push origin HEAD:main
