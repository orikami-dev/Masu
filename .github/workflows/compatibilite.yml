name: Compatibility

# Rewrites docs/COMPATIBILITE.md and docs/compatibilite.json on every "compatibility" report.
# The generator is right here: the repository contains no app code.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:

concurrency:
  group: compatibilite
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  page:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'compatibility') || contains(github.event.issue.labels.*.name, 'compatibilité') || startsWith(github.event.issue.title, '[Compatibility]') || startsWith(github.event.issue.title, '[Compatibilité]') || github.event.action == 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - docs/COMPATIBILITE.md --json docs/compatibilite.json --depot "${{ github.repository }}" <<'PY'
          import argparse
          import json
          import os
          import re
          import sys
          import urllib.request

          ETIQUETTES = {"compatibility", "compatibilité"}
          TITRES = ("[Compatibility]", "[Compatibilité]")
          # Canonical values (kept for the app and docs/compatibilite.json) <- accepted spellings.
          CANON = {
              "Parfait": "Parfait", "Perfect": "Parfait",
              "Jouable": "Jouable", "Playable": "Jouable",
              "Partiel": "Partiel", "Partial": "Partiel",
              "Démarre puis plante": "Démarre puis plante", "Starts then crashes": "Démarre puis plante",
              "Ne démarre pas": "Ne démarre pas", "Doesn't start": "Ne démarre pas",
          }
          RESULTATS = ["Parfait", "Jouable", "Partiel", "Démarre puis plante", "Ne démarre pas"]
          AFFICHAGE = {"Parfait": "Perfect", "Jouable": "Playable", "Partiel": "Partial",
                       "Démarre puis plante": "Starts then crashes", "Ne démarre pas": "Doesn't start"}
          PASTILLES = {"Parfait": "🟢", "Jouable": "🟢", "Partiel": "🟡", "Démarre puis plante": "🟠", "Ne démarre pas": "🔴"}
          CHAMPS = {
              "Game": "jeu", "Jeu": "jeu",
              "Title ID": "id_titre", "Identifiant de titre": "id_titre",
              "Game version": "version_jeu", "Version du jeu": "version_jeu",
              "Masu version": "version_masu", "Version de Masu": "version_masu",
              "Chip and system": "appareil", "Puce et système": "appareil",
              "Result": "resultat", "Résultat": "resultat",
              "How far it goes": "jusqu_ou", "Jusqu'où ça va": "jusqu_ou",
          }
          CLE = re.compile(r"(?i)(?<![0-9a-f])[0-9a-f]{32,}(?![0-9a-f])")


          def lire_tickets(depot):
              tickets, page = [], 1
              jeton = os.environ.get("GITHUB_TOKEN")
              while True:
                  url = f"https://api.github.com/repos/{depot}/issues?state=all&per_page=100&page={page}"
                  req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
                  if jeton:
                      req.add_header("Authorization", f"Bearer {jeton}")
                  with urllib.request.urlopen(req) as r:
                      lot = json.load(r)
                  tickets += [t for t in lot if "pull_request" not in t]
                  if len(lot) < 100:
                      return tickets
                  page += 1


          def champs(corps):
              """Reads the "### Title" sections that a GitHub issue form writes in the body."""
              valeurs = {}
              for bloc in re.split(r"^### ", corps or "", flags=re.M)[1:]:
                  titre, _, texte = bloc.partition("\n")
                  cle = CHAMPS.get(titre.strip())
                  texte = texte.strip()
                  if cle and texte and texte != "_No response_":
                      valeurs[cle] = CLE.sub("[key hidden]", texte.splitlines()[0].strip())[:80]
              return valeurs


          def cellule(texte):
              return (texte or "—").replace("|", "\\|")


          def retenu(t):
              # The label may not exist in the repository yet: the form title is recognized too.
              noms = {e["name"] for e in t.get("labels", [])}
              if not (ETIQUETTES & noms) and not t.get("title", "").startswith(TITRES):
                  return False
              return "invalide" not in noms and t.get("state_reason") != "not_planned"


          def regrouper(tickets):
              jeux = {}
              for t in sorted(tickets, key=lambda t: t["created_at"]):
                  if not retenu(t):
                      continue
                  v = champs(t.get("body"))
                  v["resultat"] = CANON.get(v.get("resultat"), v.get("resultat"))
                  if v.get("resultat") not in RESULTATS or not v.get("id_titre"):
                      continue
                  v["numero"], v["date"] = t["number"], t["created_at"][:10]
                  jeux.setdefault(v["id_titre"].upper(), []).append(v)
              return jeux


          def resume(jeux):
              return {
                  id_titre: {k: r[-1].get(k) for k in ("jeu", "resultat", "version_jeu", "version_masu", "date")}
                  | {"retours": len(r), "ticket": r[-1]["numero"]}
                  for id_titre, r in sorted(jeux.items())
              }


          def construire(jeux, depot):

              lignes = [
                  "# Game compatibility",
                  "",
                  "Page updated automatically from the reports sent from Masu",
                  f"([send a report](https://github.com/{depot}/issues/new?template=compatibilite.yml)).",
                  "Do not edit this file by hand: it is rewritten on every new report.",
                  "",
                  "🟢 perfect or playable · 🟡 partial · 🟠 starts then crashes · 🔴 doesn't start",
                  "",
              ]
              if not jeux:
                  lignes += ["No report yet.", ""]
              else:
                  lignes += [
                      "| Game | ID | Latest result | Game version | Masu | Chip and system | Reports |",
                      "|---|---|---|---|---|---|---|",
                  ]
                  for id_titre, retours in sorted(jeux.items(), key=lambda kv: kv[1][-1].get("jeu", "").lower()):
                      d = retours[-1]
                      lignes.append(
                          f"| {cellule(d.get('jeu'))} | `{id_titre}` | {PASTILLES[d['resultat']]} {AFFICHAGE[d['resultat']]} "
                          f"| {cellule(d.get('version_jeu'))} | {cellule(d.get('version_masu'))} | {cellule(d.get('appareil'))} "
                          f"| {len(retours)} |"
                      )
                  lignes.append("")
                  for id_titre, retours in sorted(jeux.items(), key=lambda kv: kv[1][-1].get("jeu", "").lower()):
                      lignes += [f"## {cellule(retours[-1].get('jeu'))} (`{id_titre}`)", ""]
                      lignes += ["| Date | Result | How far | Game | Masu | Chip and system | Report |",
                                 "|---|---|---|---|---|---|---|"]
                      for r in reversed(retours):
                          lignes.append(
                              f"| {r['date']} | {PASTILLES[r['resultat']]} {AFFICHAGE[r['resultat']]} | {cellule(r.get('jusqu_ou'))} "
                              f"| {cellule(r.get('version_jeu'))} | {cellule(r.get('version_masu'))} "
                              f"| {cellule(r.get('appareil'))} | #{r['numero']} |"
                          )
                      lignes.append("")
              return "\n".join(lignes)


          def main():
              p = argparse.ArgumentParser()
              p.add_argument("sortie")
              p.add_argument("--json", help="summary readable by Masu")
              p.add_argument("--depot", default="orikami-dev/Masu")
              p.add_argument("--tickets", help="JSON file of issues, instead of the API")
              a = p.parse_args()
              if a.tickets:
                  with open(a.tickets, encoding="utf-8") as f:
                      tickets = json.load(f)
              else:
                  tickets = lire_tickets(a.depot)
              jeux = regrouper(tickets)
              with open(a.sortie, "w", encoding="utf-8") as f:
                  f.write(construire(jeux, a.depot))
              if a.json:
                  with open(a.json, "w", encoding="utf-8") as f:
                      json.dump(resume(jeux), f, ensure_ascii=False, indent=2)
                      f.write("\n")
              print(f"{a.sortie}: {len(tickets)} issue(s) read", file=sys.stderr)


          if __name__ == "__main__":
              main()
          PY
      - name: Publish if the page changed
        run: |
          git add docs/COMPATIBILITE.md docs/compatibilite.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Compatibility: page updated from reports"
          git push origin HEAD:main
