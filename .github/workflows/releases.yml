# Publie les releases de Masu (tag masu-v<version>) à partir des branches temporaires apk-masu-<version>.
# Chaque branche contient un seul fichier masu-<version>.apk, signé par Orikami. La release prend ses notes dans docs/releases/masu-<version>.md.
# Lancement : onglet Actions > « Publier les releases » > Run workflow.
name: Publier les releases
on:
  workflow_dispatch:
concurrency: releases
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Releases manquantes
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          mkdir -p apk
          BR="$(git ls-remote --heads origin | sed 's#.*refs/heads/##' | grep -E '^apk-masu-[0-9]' || true)"
          for b in $BR; do
            for f in $(gh api "repos/$R/git/trees/$b" --jq '.tree[].path' | grep '\.apk$' || true); do
              gh api -H "Accept: application/vnd.github.raw" "repos/$R/contents/$f?ref=$b" > "apk/$f"
            done
          done
          EXISTING="$(gh release list --limit 500 --json tagName --jq '.[].tagName')"
          for f in $(ls apk | sort -V); do
            v="$(echo "$f" | sed -E 's/^masu-//; s/\.apk$//')"
            echo "$v" | grep -qE '^[0-9]+(\.[0-9]+)+$' || continue
            echo "$EXISTING" | grep -qx "masu-v$v" && continue
            T="Masu $v"; head -1 "docs/releases/masu-$v.md" | grep -q '⭐' && T="$T ⭐"
            notes="docs/releases/masu-$v.md"; [ -f "$notes" ] || { echo "Masu $v" > /tmp/n.md; notes=/tmp/n.md; }
            gh release create "masu-v$v" "apk/$f" --title "$T" --notes-file "$notes" --target main --latest
            echo "masu-v$v publiée"
          done
          for b in $BR; do git push origin --delete "$b"; echo "branche $b supprimée"; done
